# Align publishing coordinates with CI and docs (override via -P or env as needed).
GROUP=com.oceanbase.seekdb
VERSION_NAME=0.1.0-SNAPSHOT
android.useAndroidX=true

# JVM memory for Gradle daemon
org.gradle.jvmargs=-Xmx2048M -Dkotlin.daemon.jvm.options="-Xmx2048M"

# Faster configure when features are unused (AGP defaults)
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.databinding=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
android.defaults.buildfeatures.viewbinding=false
android.library.defaults.buildfeatures.androidresources=false

# Optional POM enrichment for Maven Central (set before publish). JitPack — the adopted
# distribution channel — overrides coordinates to com.github.ob-labs at build time, so
# these properties only matter for a future Central publication.
POM_NAME=seekdb-android
POM_DESCRIPTION=SeekDB Android compatibility and native library
POM_URL=https://github.com/ob-labs/seekdb-android/
POM_SCM_URL=https://github.com/ob-labs/seekdb-android/
POM_SCM_CONNECTION=scm:git:git://github.com/ob-labs/seekdb-android.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/ob-labs/seekdb-android.git
POM_DEVELOPER_ID=oceanbase
POM_DEVELOPER_NAME=OceanBase
POM_DEVELOPER_URL=https://github.com/oceanbase
# License metadata for a future Central publication: Apache-2.0 (as declared in the ob-labs repo
# creation vote); root LICENSE and seekdb-android/NOTICE carry the Apache-2.0 texts since the
# ob-labs migration.
POM_LICENCE_NAME=Apache-2.0
POM_LICENCE_URL=https://github.com/ob-labs/seekdb-android/blob/main/LICENSE
POM_LICENCE_DIST=repo

# Prebuilt libseekdb (native engine) artifacts, built by remote CI and hosted on S3.
# Zip naming: <prefix>libseekdb-android-<abi>.zip. The downloadLibseekdb Gradle task
# fetches them into seekdb-android/build/generated/libseekdb/jniLibs/<abi>/.
# ABIs without a prebuilt artifact are skipped with a warning. Override per build with -PLIBSEEKDB_URL_PREFIX=...
LIBSEEKDB_URL_PREFIX=https://oceanbase-seekdb-builds.s3.ap-southeast-1.amazonaws.com/libseekdb/all_commits/0e49209e09fe58b6e4e91b6cb0d10131a0d19a4c/
# ABIs to fetch (comma-separated). Add more as they are published, e.g. arm64-v8a,x86_64
LIBSEEKDB_ABIS=arm64-v8a

# Maven Central host for com.vanniktech.maven.publish. OSSRH (S01) is shut down;
# DEFAULT routes to the Central Portal, whose credentials are user tokens
# (mavenCentralUsername / mavenCentralPassword) — see docs/seekdb-android/testing-and-release.md §8.
SONATYPE_HOST=DEFAULT
