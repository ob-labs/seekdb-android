name: ci

permissions:
  contents: read

on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "adopt"

      # --- Instrumented tests are paused (degraded gate) ---------------------
      # The seekdb engine only publishes arm64-v8a prebuilt zips, and GitHub
      # hosted runners cannot boot an arm64 emulator (macOS runners are
      # virtualized: no nested virtualization/HVF; x86 images are unsupported on
      # aarch64 hosts). The engine CI will publish libseekdb-android-x86_64.zip
      # once android/x86_64 devdeps exist on the development-kit mirror; then
      # re-enable the emulator step below (ubuntu-latest + KVM + x86_64 image,
      # -PLIBSEEKDB_ABIS=x86_64) and bump LIBSEEKDB_URL_PREFIX to the engine
      # commit that carries the x86_64 zip (see
      # docs/seekdb-android/testing-and-release.md §2).
      # - name: Run Android tests (instrumented)
      #   uses: reactivecircus/android-emulator-runner@v2
      #   with:
      #     api-level: 29
      #     arch: x86_64
      #     ndk: "28.2.13676358"
      #     cmake: "3.22.1"
      #     emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
      #     disable-animations: true
      #     script: ./gradlew connectedAndroidTest -PLIBSEEKDB_ABIS=x86_64 --stacktrace

      # JNI glue compiles via externalNativeBuild (NDK 28.2.13676358 + CMake
      # 3.22.1, matching seekdb-android/build.gradle). sdkmanager is not on PATH
      # on the runner image, so call it via ANDROID_SDK_ROOT.
      - name: Install NDK & CMake
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;28.2.13676358" "cmake;3.22.1" >/dev/null

      # JVM unit tests + debug assemble (packages the arm64 engine downloaded
      # from the pinned LIBSEEKDB_URL_PREFIX). Instrumentation coverage returns
      # with the emulator step above once the x86_64 engine is published.
      - name: Unit tests + assemble
        run: ./gradlew :seekdb-android:testDebugUnitTest :seekdb-android:assembleDebug --stacktrace

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ./**/build/reports/tests/

      # Publish to Central on main push. The secrets context is unavailable in
      # `if:` expressions, so this step runs on every main push and no-ops unless
      # the Sonatype/GPG secrets are configured (undefined secrets resolve to empty,
      # §8): without credentials the vanniktech publish would fail the build.
      - name: Publish to Maven (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SonatypeUsername }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SonatypePassword }}
          # GPG signing (signAllPublications()); publish fails without these secrets.
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SigningInMemoryKey }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SigningInMemoryKeyId }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SigningInMemoryKeyPassword }}
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_mavenCentralUsername" ] || [ -z "$ORG_GRADLE_PROJECT_signingInMemoryKey" ]; then
            echo "::warning::Sonatype/GPG secrets not configured; skipping Central publish"
            exit 0
          fi
          ./gradlew publish
