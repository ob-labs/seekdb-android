name: ci

permissions:
  contents: read

on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [29]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "adopt"

      # Hardware-accelerated emulators need KVM on Linux runners (see
      # reactivecircus/android-emulator-runner README). GitHub's macOS runners are
      # virtualized (arm64) and cannot run any Android emulator (no nested
      # virtualization / HVF), so instrumented tests run on ubuntu + KVM instead.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          # x86_64 image (host arch matches; fast under KVM). The test APK must
          # contain a matching native engine: the seekdb engine only publishes
          # arm64-v8a prebuilt zips on S3 today, so LIBSEEKDB_ABIS=x86_64 makes
          # the download task fetch libseekdb-android-x86_64.zip (engine CI
          # publishes it once android/x86_64 devdeps exist on the development-kit
          # mirror; until then this step fails loudly instead of skipping tests).
          arch: x86_64
          ndk: "28.2.13676358"
          cmake: "3.22.1"
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedAndroidTest -PLIBSEEKDB_ABIS=x86_64 --stacktrace

      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-results ${{ matrix.api-level }}
          path: ./**/build/reports/androidTests/connected/**

      # Publish to Central on main push. The secrets context is unavailable in
      # `if:` expressions, so this step runs on every main push and no-ops unless
      # the Sonatype/GPG secrets are configured (undefined secrets resolve to empty,
      # §8): without credentials the vanniktech publish would fail the build.
      - name: Publish to Maven (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SonatypeUsername }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SonatypePassword }}
          # GPG signing (signAllPublications()); publish fails without these secrets.
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SigningInMemoryKey }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SigningInMemoryKeyId }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SigningInMemoryKeyPassword }}
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_mavenCentralUsername" ] || [ -z "$ORG_GRADLE_PROJECT_signingInMemoryKey" ]; then
            echo "::warning::Sonatype/GPG secrets not configured; skipping Central publish"
            exit 0
          fi
          ./gradlew publish
