name: ci

permissions:
  contents: read

on: [push, pull_request]

jobs:
  ci:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [29]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "adopt"

      - name: Run Android tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          arch: x86
          script: ./gradlew connectedAndroidTest --stacktrace

      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-results ${{ matrix.api-level }}
          path: ./**/build/reports/androidTests/connected/**

      # Publish to Central on main push. Gated on the secrets so the step is
      # skipped while the com.oceanbase namespace membership is pending (§8):
      # without credentials the vanniktech publish would fail the build.
      - name: Publish to Maven (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.SonatypeUsername != '' && secrets.SigningInMemoryKey != ''
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SonatypeUsername }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SonatypePassword }}
          # GPG signing (signAllPublications()); publish fails without these secrets.
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SigningInMemoryKey }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SigningInMemoryKeyId }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SigningInMemoryKeyPassword }}
        run: ./gradlew publish
